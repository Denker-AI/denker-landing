  <circle cx="336" cy="286" r="4" fill="#FFD60A" opacity="0.6"/>
  <rect x="348" y="281" width="50" height="10" rx="3" fill="#A1A1A6" opacity="0.3"/>
  <!-- Bar chart -->
  <rect x="344" y="350" width="16" height="30" rx="3" fill="#3AF88C" opacity="0.3"/>
  <rect x="368" y="338" width="16" height="42" rx="3" fill="#3AF88C" opacity="0.4"/>
  <rect x="392" y="325" width="16" height="55" rx="3" fill="#3AF88C" opacity="0.5"/>
  <rect x="416" y="340" width="16" height="40" rx="3" fill="#3AF88C" opacity="0.35"/>
  <rect x="440" y="315" width="16" height="65" rx="3" fill="#3AF88C" opacity="0.6"/>
  <rect x="464" y="330" width="16" height="50" rx="3" fill="#3AF88C" opacity="0.45"/>
  <rect x="488" y="345" width="16" height="35" rx="3" fill="#3AF88C" opacity="0.3"/>

  <!-- Frame 4: Chat/email -->
  <rect x="580" y="100" width="180" height="240" rx="12" fill="#1a1f2a" stroke="#242a36" stroke-width="1"/>
  <rect x="580" y="100" width="180" height="36" rx="12" fill="#1e2230"/>
  <circle cx="598" cy="118" r="5" fill="#F59E0B" opacity="0.6"/>
  <rect x="612" y="113" width="50" height="10" rx="3" fill="#A1A1A6" opacity="0.3"/>
  <!-- Chat bubbles -->
  <rect x="596" y="150" width="120" height="24" rx="8" fill="#242a36"/>
  <rect x="596" y="146" width="120" height="24" rx="8" fill="none" stroke="#242a36" stroke-width="0.5"/>
  <rect x="620" y="184" width="124" height="24" rx="8" fill="#3AF88C" opacity="0.12"/>
  <rect x="596" y="220" width="100" height="24" rx="8" fill="#242a36"/>
  <rect x="630" y="254" width="114" height="24" rx="8" fill="#3AF88C" opacity="0.12"/>
  <rect x="596" y="290" width="140" height="24" rx="8" fill="#242a36"/>
  <!-- Input area -->
  <rect x="592" y="318" width="156" height="12" rx="4" fill="#1e2230" opacity="0.8"/>

  <!-- Connection lines between frames -->
  <line x1="280" y1="180" x2="310" y2="150" stroke="#3AF88C" stroke-width="1" opacity="0.2" stroke-dasharray="4 4"/>
  <line x1="550" y1="180" x2="580" y2="200" stroke="#3AF88C" stroke-width="1" opacity="0.2" stroke-dasharray="4 4"/>
  <line x1="440" y1="250" x2="420" y2="270" stroke="#3AF88C" stroke-width="1" opacity="0.15" stroke-dasharray="4 4"/>

  <!-- Glow effect -->
  <ellipse cx="400" cy="200" rx="250" ry="150" fill="#3AF88C" opacity="0.02"/>
</svg>
