    <circle cx="40" cy="40" r="1" fill="#A1A1A6"/><circle cx="80" cy="40" r="1" fill="#A1A1A6"/>
    <circle cx="120" cy="40" r="1" fill="#A1A1A6"/><circle cx="160" cy="40" r="1" fill="#A1A1A6"/>
    <circle cx="200" cy="40" r="1" fill="#A1A1A6"/><circle cx="240" cy="40" r="1" fill="#A1A1A6"/>
    <circle cx="280" cy="40" r="1" fill="#A1A1A6"/><circle cx="320" cy="40" r="1" fill="#A1A1A6"/>
    <circle cx="360" cy="40" r="1" fill="#A1A1A6"/><circle cx="400" cy="40" r="1" fill="#A1A1A6"/>
    <circle cx="440" cy="40" r="1" fill="#A1A1A6"/><circle cx="480" cy="40" r="1" fill="#A1A1A6"/>
    <circle cx="520" cy="40" r="1" fill="#A1A1A6"/><circle cx="560" cy="40" r="1" fill="#A1A1A6"/>
    <circle cx="600" cy="40" r="1" fill="#A1A1A6"/><circle cx="640" cy="40" r="1" fill="#A1A1A6"/>
    <circle cx="680" cy="40" r="1" fill="#A1A1A6"/><circle cx="720" cy="40" r="1" fill="#A1A1A6"/>
    <circle cx="760" cy="40" r="1" fill="#A1A1A6"/>
    <circle cx="40" cy="80" r="1" fill="#A1A1A6"/><circle cx="80" cy="80" r="1" fill="#A1A1A6"/>
    <circle cx="120" cy="80" r="1" fill="#A1A1A6"/><circle cx="160" cy="80" r="1" fill="#A1A1A6"/>
    <circle cx="200" cy="80" r="1" fill="#A1A1A6"/><circle cx="240" cy="80" r="1" fill="#A1A1A6"/>
    <circle cx="280" cy="80" r="1" fill="#A1A1A6"/><circle cx="320" cy="80" r="1" fill="#A1A1A6"/>
    <circle cx="360" cy="80" r="1" fill="#A1A1A6"/><circle cx="400" cy="80" r="1" fill="#A1A1A6"/>
    <circle cx="440" cy="80" r="1" fill="#A1A1A6"/><circle cx="480" cy="80" r="1" fill="#A1A1A6"/>
    <circle cx="520" cy="80" r="1" fill="#A1A1A6"/><circle cx="560" cy="80" r="1" fill="#A1A1A6"/>
    <circle cx="600" cy="80" r="1" fill="#A1A1A6"/><circle cx="640" cy="80" r="1" fill="#A1A1A6"/>
    <circle cx="680" cy="80" r="1" fill="#A1A1A6"/><circle cx="720" cy="80" r="1" fill="#A1A1A6"/>
    <circle cx="760" cy="80" r="1" fill="#A1A1A6"/>
  </g>

  <!-- Frame 1: Research panel -->
  <rect x="60" y="70" width="220" height="260" rx="12" fill="#1a1f2a" stroke="#242a36" stroke-width="1"/>
  <rect x="60" y="70" width="220" height="36" rx="12" fill="#1e2230"/>
  <circle cx="78" cy="88" r="5" fill="#3AF88C" opacity="0.6"/>
  <rect x="92" y="83" width="60" height="10" rx="3" fill="#A1A1A6" opacity="0.3"/>
  <!-- Text lines -->
  <rect x="76" y="122" width="180" height="6" rx="2" fill="#A1A1A6" opacity="0.15"/>
  <rect x="76" y="138" width="150" height="6" rx="2" fill="#A1A1A6" opacity="0.15"/>
  <rect x="76" y="154" width="170" height="6" rx="2" fill="#A1A1A6" opacity="0.15"/>
  <rect x="76" y="170" width="120" height="6" rx="2" fill="#A1A1A6" opacity="0.15"/>
  <rect x="76" y="196" width="180" height="6" rx="2" fill="#A1A1A6" opacity="0.12"/>
  <rect x="76" y="212" width="160" height="6" rx="2" fill="#A1A1A6" opacity="0.12"/>
  <rect x="76" y="228" width="140" height="6" rx="2" fill="#A1A1A6" opacity="0.12"/>
  <!-- Highlight line -->
  <rect x="76" y="254" width="100" height="8" rx="3" fill="#3AF88C" opacity="0.15"/>
  <rect x="76" y="274" width="80" height="6" rx="2" fill="#3AF88C" opacity="0.1"/>

