  <rect x="310" y="50" width="240" height="200" rx="12" fill="#1a1f2a" stroke="#242a36" stroke-width="1"/>
  <rect x="310" y="50" width="240" height="36" rx="12" fill="#1e2230"/>
  <circle cx="328" cy="68" r="5" fill="#60A5FA" opacity="0.6"/>
  <rect x="342" y="63" width="50" height="10" rx="3" fill="#A1A1A6" opacity="0.3"/>
  <!-- Code lines -->
  <rect x="326" y="100" width="40" height="5" rx="2" fill="#60A5FA" opacity="0.3"/>
  <rect x="374" y="100" width="80" height="5" rx="2" fill="#A1A1A6" opacity="0.2"/>
  <rect x="340" y="114" width="60" height="5" rx="2" fill="#3AF88C" opacity="0.25"/>
  <rect x="408" y="114" width="40" height="5" rx="2" fill="#FFD60A" opacity="0.2"/>
  <rect x="340" y="128" width="90" height="5" rx="2" fill="#A1A1A6" opacity="0.15"/>
  <rect x="340" y="142" width="70" height="5" rx="2" fill="#3AF88C" opacity="0.2"/>
  <rect x="326" y="156" width="50" height="5" rx="2" fill="#60A5FA" opacity="0.3"/>
  <rect x="326" y="176" width="100" height="5" rx="2" fill="#A1A1A6" opacity="0.15"/>
  <rect x="340" y="190" width="80" height="5" rx="2" fill="#FFD60A" opacity="0.15"/>
  <rect x="326" y="210" width="40" height="5" rx="2" fill="#60A5FA" opacity="0.25"/>

  <!-- Frame 3: Chart/data -->
  <rect x="320" y="270" width="200" height="120" rx="12" fill="#1a1f2a" stroke="#242a36" stroke-width="1"/>
