<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F1115"/>
      <stop offset="100%" stop-color="#141821"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7" fill="none" stroke="#3AF88C" stroke-width="1" opacity="0.5"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7" fill="none" stroke="#60A5FA" stroke-width="1" opacity="0.5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Input: Natural language prompt -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="200" height="80" rx="12" fill="#1a1f2a" stroke="#3AF88C" stroke-width="1.5"/>
    <text x="100" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#3AF88C" font-weight="600" letter-spacing="0.05em">YOUR PROMPT</text>
    <rect x="16" y="40" width="168" height="8" rx="3" fill="#A1A1A6" opacity="0.15"/>
    <rect x="16" y="54" width="130" height="8" rx="3" fill="#A1A1A6" opacity="0.1"/>
  </g>

  <!-- Arrow from prompt to planner -->
  <line x1="260" y1="200" x2="310" y2="200" stroke="#3AF88C" stroke-width="1.5" opacity="0.4" marker-end="url(#arrow)"/>

  <!-- Planner node -->
  <g transform="translate(320, 170)">
    <rect x="0" y="0" width="140" height="60" rx="10" fill="#1a1f2a" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="70" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#60A5FA" font-weight="600" letter-spacing="0.03em">PLAN</text>
    <g transform="translate(20, 34)">
      <rect x="0" y="0" width="8" height="8" rx="2" fill="#3AF88C" opacity="0.3"/>
      <rect x="14" y="1" width="40" height="5" rx="2" fill="#A1A1A6" opacity="0.2"/>
      <rect x="60" y="0" width="8" height="8" rx="2" fill="#3AF88C" opacity="0.3"/>
      <rect x="74" y="1" width="35" height="5" rx="2" fill="#A1A1A6" opacity="0.2"/>
    </g>
  </g>

  <!-- Arrows fanning out from planner to parallel agents -->
  <line x1="460" y1="185" x2="520" y2="100" stroke="#3AF88C" stroke-width="1.5" opacity="0.3" marker-end="url(#arrow)"/>
  <line x1="460" y1="200" x2="520" y2="200" stroke="#3AF88C" stroke-width="1.5" opacity="0.3" marker-end="url(#arrow)"/>
  <line x1="460" y1="215" x2="520" y2="300" stroke="#3AF88C" stroke-width="1.5" opacity="0.3" marker-end="url(#arrow)"/>

  <!-- Parallel agent 1: Research -->
  <g transform="translate(530, 65)">
    <rect x="0" y="0" width="140" height="70" rx="10" fill="#1a1f2a" stroke="#3AF88C" stroke-width="1"/>
    <circle cx="20" cy="20" r="10" fill="#1a1f2a" stroke="#3AF88C" stroke-width="1"/>
    <text x="20" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#3AF88C" font-weight="600">A</text>
    <text x="40" y="24" font-family="Inter, sans-serif" font-size="11" fill="#F5F5F7" font-weight="500">Research</text>
    <!-- Progress bar -->
    <rect x="16" y="42" width="108" height="6" rx="3" fill="#242a36"/>
    <rect x="16" y="42" width="90" height="6" rx="3" fill="#3AF88C" opacity="0.5"/>
    <text x="16" y="60" font-family="Inter, sans-serif" font-size="9" fill="#A1A1A6">Scanning 4 sources...</text>
  </g>

  <!-- Parallel agent 2: Code -->
  <g transform="translate(530, 165)">
    <rect x="0" y="0" width="140" height="70" rx="10" fill="#1a1f2a" stroke="#60A5FA" stroke-width="1"/>
    <circle cx="20" cy="20" r="10" fill="#1a1f2a" stroke="#60A5FA" stroke-width="1"/>
    <text x="20" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#60A5FA" font-weight="600">K</text>
    <text x="40" y="24" font-family="Inter, sans-serif" font-size="11" fill="#F5F5F7" font-weight="500">Build</text>
    <!-- Progress bar -->
    <rect x="16" y="42" width="108" height="6" rx="3" fill="#242a36"/>
    <rect x="16" y="42" width="60" height="6" rx="3" fill="#60A5FA" opacity="0.5"/>
    <text x="16" y="60" font-family="Inter, sans-serif" font-size="9" fill="#A1A1A6">Writing handler...</text>
  </g>

  <!-- Parallel agent 3: Draft -->
  <g transform="translate(530, 265)">
    <rect x="0" y="0" width="140" height="70" rx="10" fill="#1a1f2a" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="20" cy="20" r="10" fill="#1a1f2a" stroke="#F59E0B" stroke-width="1"/>
    <text x="20" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#F59E0B" font-weight="600">M</text>
    <text x="40" y="24" font-family="Inter, sans-serif" font-size="11" fill="#F5F5F7" font-weight="500">Draft</text>
    <!-- Progress bar -->
    <rect x="16" y="42" width="108" height="6" rx="3" fill="#242a36"/>
    <rect x="16" y="42" width="75" height="6" rx="3" fill="#F59E0B" opacity="0.5"/>
    <text x="16" y="60" font-family="Inter, sans-serif" font-size="9" fill="#A1A1A6">Composing email...</text>
  </g>

  <!-- "All running in parallel" label -->
  <g transform="translate(700, 185)">
    <text x="0" y="0" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#3AF88C" opacity="0.5" font-weight="500" transform="rotate(90)">PARALLEL</text>
  </g>

  <!-- Ambient glow -->
  <ellipse cx="400" cy="200" rx="280" ry="160" fill="#3AF88C" opacity="0.015"/>
</svg>
