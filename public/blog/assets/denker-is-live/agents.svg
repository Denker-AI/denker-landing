<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F1115"/>
      <stop offset="100%" stop-color="#141821"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g opacity="0.08">
    <line x1="0" y1="80" x2="800" y2="80" stroke="#A1A1A6" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="800" y2="160" stroke="#A1A1A6" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="800" y2="240" stroke="#A1A1A6" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="800" y2="320" stroke="#A1A1A6" stroke-width="0.5"/>
    <line x1="160" y1="0" x2="160" y2="400" stroke="#A1A1A6" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="400" stroke="#A1A1A6" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="400" stroke="#A1A1A6" stroke-width="0.5"/>
    <line x1="640" y1="0" x2="640" y2="400" stroke="#A1A1A6" stroke-width="0.5"/>
  </g>

  <!-- Agent 1: Aria (Research) — top left -->
  <g transform="translate(120, 80)">
    <!-- Agent avatar -->
    <circle cx="0" cy="0" r="22" fill="#1a1f2a" stroke="#3AF88C" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#3AF88C" font-weight="600">A</text>
    <!-- Name tag -->
    <rect x="28" y="-12" width="44" height="20" rx="6" fill="#3AF88C" opacity="0.12"/>
    <text x="50" y="3" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#3AF88C" font-weight="500">Aria</text>
    <!-- Cursor trail -->
    <path d="M 80 0 Q 120 -20 180 10 Q 240 40 300 20" stroke="#3AF88C" stroke-width="1.5" opacity="0.3" stroke-dasharray="6 4" fill="none"/>
    <!-- Activity: typing indicator -->
    <g transform="translate(160, -30)">
      <rect x="0" y="0" width="80" height="28" rx="8" fill="#1a1f2a" stroke="#242a36" stroke-width="1"/>
      <circle cx="20" cy="14" r="3" fill="#3AF88C" opacity="0.6"/>
      <circle cx="34" cy="14" r="3" fill="#3AF88C" opacity="0.4"/>
      <circle cx="48" cy="14" r="3" fill="#3AF88C" opacity="0.2"/>
    </g>
  </g>

  <!-- Agent 2: Kai (Code) — center -->
  <g transform="translate(400, 200)">
    <!-- Agent avatar -->
    <circle cx="0" cy="0" r="22" fill="#1a1f2a" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#60A5FA" font-weight="600">K</text>
    <!-- Name tag -->
    <rect x="28" y="-12" width="36" height="20" rx="6" fill="#60A5FA" opacity="0.12"/>
    <text x="46" y="3" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#60A5FA" font-weight="500">Kai</text>
    <!-- Cursor trail -->
    <path d="M 72 0 Q 110 30 160 -10 Q 210 -50 260 -20" stroke="#60A5FA" stroke-width="1.5" opacity="0.3" stroke-dasharray="6 4" fill="none"/>
    <!-- Working on a code frame -->
    <g transform="translate(100, -60)">
      <rect x="0" y="0" width="160" height="90" rx="8" fill="#1a1f2a" stroke="#242a36" stroke-width="1"/>
      <rect x="0" y="0" width="160" height="24" rx="8" fill="#1e2230"/>
      <circle cx="14" cy="12" r="3" fill="#60A5FA" opacity="0.5"/>
      <rect x="12" y="32" width="30" height="4" rx="1" fill="#60A5FA" opacity="0.3"/>
      <rect x="48" y="32" width="60" height="4" rx="1" fill="#A1A1A6" opacity="0.15"/>
      <rect x="24" y="44" width="50" height="4" rx="1" fill="#3AF88C" opacity="0.2"/>
      <rect x="80" y="44" width="30" height="4" rx="1" fill="#FFD60A" opacity="0.15"/>
      <rect x="24" y="56" width="70" height="4" rx="1" fill="#A1A1A6" opacity="0.12"/>
      <rect x="12" y="68" width="40" height="4" rx="1" fill="#60A5FA" opacity="0.25"/>
    </g>
  </g>

  <!-- Agent 3: Mia (Outreach) — bottom right -->
  <g transform="translate(620, 280)">
    <!-- Agent avatar -->
    <circle cx="0" cy="0" r="22" fill="#1a1f2a" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#F59E0B" font-weight="600">M</text>
    <!-- Name tag -->
    <rect x="28" y="-12" width="40" height="20" rx="6" fill="#F59E0B" opacity="0.12"/>
    <text x="48" y="3" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#F59E0B" font-weight="500">Mia</text>
    <!-- Cursor trail -->
    <path d="M -30 -10 Q -60 -40 -100 -20 Q -140 0 -180 -30" stroke="#F59E0B" stroke-width="1.5" opacity="0.3" stroke-dasharray="6 4" fill="none"/>
    <!-- Working on email frame -->
    <g transform="translate(-200, -80)">
      <rect x="0" y="0" width="140" height="80" rx="8" fill="#1a1f2a" stroke="#242a36" stroke-width="1"/>
      <rect x="0" y="0" width="140" height="24" rx="8" fill="#1e2230"/>
      <circle cx="14" cy="12" r="3" fill="#F59E0B" opacity="0.5"/>
      <rect x="12" y="32" width="100" height="4" rx="1" fill="#A1A1A6" opacity="0.15"/>
      <rect x="12" y="44" width="80" height="4" rx="1" fill="#A1A1A6" opacity="0.12"/>
      <rect x="12" y="56" width="90" height="4" rx="1" fill="#A1A1A6" opacity="0.1"/>
    </g>
  </g>

  <!-- User cursor -->
  <g transform="translate(300, 160)">
    <polygon points="0,0 0,18 5,14 10,22 14,20 9,12 16,10" fill="#F5F5F7" opacity="0.8"/>
    <rect x="18" y="6" width="36" height="16" rx="4" fill="#F5F5F7" opacity="0.15"/>
    <text x="36" y="17" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#F5F5F7" opacity="0.7" font-weight="500">You</text>
  </g>

  <!-- Ambient glow -->
  <ellipse cx="400" cy="200" rx="300" ry="180" fill="#3AF88C" opacity="0.015"/>
  <ellipse cx="600" cy="280" rx="150" ry="100" fill="#F59E0B" opacity="0.01"/>
  <ellipse cx="200" cy="100" rx="150" ry="100" fill="#3AF88C" opacity="0.01"/>
</svg>
