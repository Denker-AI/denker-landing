<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F1115"/>
      <stop offset="100%" stop-color="#141821"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Knowledge graph connections (drawn first, behind nodes) -->
  <g opacity="0.25">
    <!-- Central node connections -->
    <line x1="400" y1="200" x2="220" y2="120" stroke="#3AF88C" stroke-width="1.5"/>
    <line x1="400" y1="200" x2="580" y2="120" stroke="#3AF88C" stroke-width="1.5"/>
    <line x1="400" y1="200" x2="200" y2="300" stroke="#60A5FA" stroke-width="1.5"/>
    <line x1="400" y1="200" x2="600" y2="300" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="400" y1="200" x2="400" y2="60" stroke="#3AF88C" stroke-width="1"/>
    <line x1="400" y1="200" x2="400" y2="340" stroke="#60A5FA" stroke-width="1"/>
    <!-- Secondary connections -->
    <line x1="220" y1="120" x2="120" y2="180" stroke="#3AF88C" stroke-width="1" opacity="0.6"/>
    <line x1="220" y1="120" x2="300" y2="60" stroke="#A1A1A6" stroke-width="1" opacity="0.4"/>
    <line x1="580" y1="120" x2="680" y2="180" stroke="#F59E0B" stroke-width="1" opacity="0.6"/>
    <line x1="580" y1="120" x2="500" y2="60" stroke="#A1A1A6" stroke-width="1" opacity="0.4"/>
    <line x1="200" y1="300" x2="120" y2="260" stroke="#60A5FA" stroke-width="1" opacity="0.5"/>
    <line x1="200" y1="300" x2="280" y2="350" stroke="#A1A1A6" stroke-width="1" opacity="0.4"/>
    <line x1="600" y1="300" x2="680" y2="260" stroke="#3AF88C" stroke-width="1" opacity="0.5"/>
    <line x1="600" y1="300" x2="520" y2="350" stroke="#A1A1A6" stroke-width="1" opacity="0.4"/>
    <!-- Cross connections -->
    <line x1="220" y1="120" x2="200" y2="300" stroke="#A1A1A6" stroke-width="0.5" opacity="0.3" stroke-dasharray="4 4"/>
    <line x1="580" y1="120" x2="600" y2="300" stroke="#A1A1A6" stroke-width="0.5" opacity="0.3" stroke-dasharray="4 4"/>
  </g>

  <!-- Central node: Project -->
  <g transform="translate(400, 200)">
    <circle cx="0" cy="0" r="32" fill="#1a1f2a" stroke="#3AF88C" stroke-width="2"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#3AF88C" stroke-width="0.5" opacity="0.3"/>
    <text x="0" y="-4" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#3AF88C" font-weight="600" letter-spacing="0.05em">PROJECT</text>
    <text x="0" y="10" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#F5F5F7" font-weight="500">Denker</text>
  </g>

  <!-- Node: Person (top left) -->
  <g transform="translate(220, 120)">
    <circle cx="0" cy="0" r="24" fill="#1a1f2a" stroke="#3AF88C" stroke-width="1.5"/>
    <text x="0" y="-3" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#A1A1A6" font-weight="500">PERSON</text>
    <text x="0" y="10" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#F5F5F7" font-weight="500">Alex</text>
  </g>

  <!-- Node: Company (top right) -->
  <g transform="translate(580, 120)">
    <circle cx="0" cy="0" r="24" fill="#1a1f2a" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="0" y="-3" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#A1A1A6" font-weight="500">COMPANY</text>
    <text x="0" y="10" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#F5F5F7" font-weight="500">Acme</text>
  </g>

  <!-- Node: Decision (bottom left) -->
  <g transform="translate(200, 300)">
    <circle cx="0" cy="0" r="24" fill="#1a1f2a" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="0" y="-3" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#A1A1A6" font-weight="500">DECISION</text>
    <text x="0" y="10" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#F5F5F7" font-weight="500">Use Go</text>
  </g>

  <!-- Node: Task (bottom right) -->
  <g transform="translate(600, 300)">
    <circle cx="0" cy="0" r="24" fill="#1a1f2a" stroke="#3AF88C" stroke-width="1.5"/>
    <text x="0" y="-3" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#A1A1A6" font-weight="500">TASK</text>
    <text x="0" y="10" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#F5F5F7" font-weight="500">Deploy</text>
  </g>

  <!-- Tertiary nodes (smaller) -->
  <g opacity="0.7">
    <circle cx="120" cy="180" r="14" fill="#1a1f2a" stroke="#242a36" stroke-width="1"/>
    <text x="120" y="183" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#A1A1A6">Email</text>

    <circle cx="680" cy="180" r="14" fill="#1a1f2a" stroke="#242a36" stroke-width="1"/>
    <text x="680" y="183" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#A1A1A6">Docs</text>

    <circle cx="300" cy="60" r="14" fill="#1a1f2a" stroke="#242a36" stroke-width="1"/>
    <text x="300" y="63" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#A1A1A6">CTO</text>

    <circle cx="500" cy="60" r="14" fill="#1a1f2a" stroke="#242a36" stroke-width="1"/>
    <text x="500" y="63" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#A1A1A6">Q1</text>

    <circle cx="120" cy="260" r="14" fill="#1a1f2a" stroke="#242a36" stroke-width="1"/>
    <text x="120" y="263" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#A1A1A6">API</text>

    <circle cx="680" cy="260" r="14" fill="#1a1f2a" stroke="#242a36" stroke-width="1"/>
    <text x="680" y="263" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#A1A1A6">v2.0</text>

    <circle cx="280" cy="350" r="14" fill="#1a1f2a" stroke="#242a36" stroke-width="1"/>
    <text x="280" y="353" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#A1A1A6">Perf</text>

    <circle cx="520" cy="350" r="14" fill="#1a1f2a" stroke="#242a36" stroke-width="1"/>
    <text x="520" y="353" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#A1A1A6">Infra</text>

    <circle cx="400" cy="60" r="14" fill="#1a1f2a" stroke="#242a36" stroke-width="1"/>
    <text x="400" y="63" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#A1A1A6">MVP</text>

    <circle cx="400" cy="340" r="14" fill="#1a1f2a" stroke="#242a36" stroke-width="1"/>
    <text x="400" y="343" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#A1A1A6">Ship</text>
  </g>

  <!-- Ambient glow -->
  <ellipse cx="400" cy="200" rx="200" ry="140" fill="#3AF88C" opacity="0.02"/>
</svg>
