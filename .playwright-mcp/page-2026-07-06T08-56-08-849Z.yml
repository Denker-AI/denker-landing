      - generic [ref=e201]:
        - heading "Siri AI on Apple Vision Pro" [level=2] [ref=e202]
        - paragraph [ref=e203]:
          - text: Your AI assistant.
          - text: More personal. More powerful.
        - paragraph [ref=e205]:
          - text: Siri AI is powered by Apple Intelligence and more helpful than ever.
          - superscript [ref=e206]:
            - link "Footnote 1" [ref=e207] [cursor=pointer]:
              - /url: "#footnote-1"
              - text: "1"
          - text: Get more done and express your creativity in new ways with richer answers, natural conversations, and a new, dedicated app.
        - generic [ref=e209]: Siri AI coming in English later this year.
      - list "Siri AI gallery" [ref=e213]:
        - listitem [ref=e214]:
          - generic [ref=e215]:
            - heading "Just ask Siri AI." [level=3] [ref=e216]
            - paragraph [ref=e217]: Powered by Apple Intelligence, Siri AI is your conversational AI assistant with entirely new capabilities on Apple Vision Pro. Brainstorm vacations, explore new spatial experiences, and engage in natural, back-and-forth conversations. You can pin a visualization of Siri anywhere in your space and speak to Siri just by looking at it.
          - img "Apple Vision Pro view of a report on the left and a query for Siri with responses on the right" [ref=e221]
        - listitem [ref=e222]:
          - generic [ref=e223]:
            - heading "Siri understands your personal context." [level=3] [ref=e224]
            - paragraph [ref=e225]: Siri AI can find relevant answers to what you’re looking for just by asking. Search for a photo from years ago to turn it into a spatial scene, ask Siri to suggest the perfect Environment to unwind in, or pull up an article you started reading on another Apple device.
          - img "Query for Siri AI to retrieve recent vacation photos, text overlays photo grid" [ref=e229]
        - listitem [ref=e230]:
          - generic [ref=e231]:
            - heading "Take action in more apps." [level=3] [ref=e232]
            - paragraph [ref=e233]: Siri AI can take actions in apps like Messages, Music, Reminders, and more based on what you’re doing in the moment. Quickly edit a message you just sent or summarize an article you have open in Safari.
          - img "Screen with Siri AI requests for actions in several apps" [ref=e237]
        - listitem [ref=e238]:
          - generic [ref=e239]:
            - heading "Tap into broad world knowledge." [level=3] [ref=e240]
            - paragraph [ref=e241]: Ask about virtually any topic that’s on your mind, from trivia about the movie you’re watching to live sports stats and spatial game recommendations. Siri AI can reference information online to give you detailed, up-to-date insights.
          - img "Screen with starry night sky and overlay of text of query to Siri AI, Siri, why do stars twinkle in the sky?" [ref=e245]
        - listitem [ref=e246]:
          - generic [ref=e247]:
            - heading "Introducing the Siri app." [level=3] [ref=e248]
            - paragraph [ref=e249]: A dedicated app brings together all your conversations in one place, so you can ask a question on your iPhone and pick up where you left off in your Apple Vision Pro. You can also pin conversations for easy access or start a new one.
          - img "Siri app windows on a screen show multiple topics with a Search box above them" [ref=e253]
        - listitem [ref=e254]:
          - generic [ref=e255]:
            - heading "Ask Siri about anything you see." [level=3] [ref=e256]
            - paragraph [ref=e257]:
              - text: When you’re wearing Apple Vision Pro, Siri sees what you see. Use Visual Intelligence to learn more about anything in your physical or digital space and take action instantly.
              - superscript [ref=e258]:
                - link "Footnote 2" [ref=e259] [cursor=pointer]:
                  - /url: "#footnote-2"
                  - text: "2"
          - img "Answer to a query for Siri about packing camping essentials hovers above Siri Orb on left side of screen, hiking boots, ropes, backpack, water bottle, and head lamp sit on table on right side of screen" [ref=e263]
        - listitem [ref=e264]:
          - generic [ref=e265]:
            - heading "Write with Siri virtually anywhere you type." [level=3] [ref=e266]
            - paragraph [ref=e267]: Siri AI can now generate a draft from scratch or provide feedback on what you’ve written. Just describe what you need in your own words.
          - img "Apple Vision Pro view, a document regarding photography practices is open and Siri writing prompts hover to the side of it, prompts include Proofread, Rewrite, and How does this sound?" [ref=e271]
        - listitem [ref=e272]:
