          - listitem [ref=e486]: Apple Intelligence on iOS 27, iPadOS 27, macOS 27, watchOS 27, and visionOS 27 is available on all iPhone 16 models and later, iPhone 15 Pro, iPhone 15 Pro Max, iPad mini (A17 Pro), iPad models with M1 and later, MacBook Neo (A18 Pro), Mac models with M1 and later, Apple Vision Pro with M2 and later, Apple Watch Series 9 and later, Apple Watch Ultra 2 and later, and Apple Watch SE 3 when paired with an Apple Intelligence–enabled iPhone nearby, with Siri and device language set to Chinese (Simplified), Chinese (Traditional), Danish, Dutch, English, French, German, Italian, Japanese, Korean, Norwegian, Portuguese, Spanish, Swedish, Turkish, or Vietnamese. Some features may not be available in all regions or languages. Some devices may not be available in all regions.
          - listitem [ref=e487]: Available on iPhone 17 Pro, iPhone 17 Pro Max, iPhone Air, iPad models with M4 and later and at least 12GB of unified memory, Mac models with M3 and later and at least 12GB of unified memory, and Apple Vision Pro (M5).
          - listitem [ref=e488]: Testing conducted by Apple in April and May 2026 using Apple Vision Pro (M2) with visionOS 26.4 and prerelease visionOS 27. System tested from first unlock after reboot to Apple TV app launch and appearance of content. Performance varies based on configuration, settings, content, usage, software versions, environmental conditions, and other factors.
